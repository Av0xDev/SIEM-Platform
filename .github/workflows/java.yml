name: Java Service Build & Test

on:
  push:
    branches: [ main, develop ]
    paths: [ 'backend-java/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'backend-java/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: cd backend-java && mvn clean verify
    
    - name: Run tests
      run: cd backend-java && mvn test
    
    - name: Analyze with SonarQube (Optional)
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        cd backend-java
        mvn sonar:sonar -Dsonar.projectKey=siem-platform || true