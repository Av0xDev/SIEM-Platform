name: PHP CI
on:
  push:
    branches: [main, develop]
    paths: ['backend-php/**']
  pull_request:
    branches: [main, develop]
    paths: ['backend-php/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - run: composer install && vendor/bin/phpcs --standard=PSR12 src/
        working-directory: backend-php

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2' }
      - run: composer install && vendor/bin/phpunit
        working-directory: backend-php

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend-php
          push: true
          tags: ghcr.io/${{ github.repository }}/backend-php:${{ github.sha }}
