name: Security & Docker Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  docker-build:
    runs-on: ubuntu-latest
    needs: security
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Python Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-python
        push: false
        tags: siem-platform:python-latest
    
    - name: Build Java Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-java
        push: false
        tags: siem-platform:java-latest
    
    - name: Build PHP Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-php
        push: false
        tags: siem-platform:php-latest
    
    - name: Build Ruby Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend-ruby
        push: false
        tags: siem-platform:ruby-latest
    
    - name: Build Frontend Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: false
        tags: siem-platform:frontend-latest