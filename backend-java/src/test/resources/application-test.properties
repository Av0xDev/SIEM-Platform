# =============================================
# SIEM Platform - Test Configuration
# =============================================

spring.datasource.url=jdbc:h2:mem:siem_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=testSecretKeyForJwtTokenGenerationAndValidationInTests12345678901234
jwt.expiration=86400000
jwt.refresh-expiration=604800000

cors.allowed-origins=http://localhost:3000
logging.level.com.siem=WARN
