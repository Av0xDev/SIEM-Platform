spring.application.name=siem-platform
spring.profiles.active=prod

# PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/siem_db
spring.datasource.username=siem_user
spring.datasource.password=siem_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# MongoDB
spring.data.mongodb.uri=mongodb://siem_user:siem_password_123@mongodb:27017/siem_db

# Server
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.siem=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security
jwt.secret=your-secret-key-change-in-production
jwt.expiration=86400000

# CORS
allowed.origins=http://localhost:3001,http://localhost:3000

# External Services
python.service.url=http://python:5000
ruby.service.url=http://ruby:3000