# =============================================
# SIEM Platform - Application Configuration
# =============================================

# Server
server.port=8080
server.servlet.context-path=/

# =============================================
# Database - PostgreSQL
# =============================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/siem_db}
spring.datasource.username=${DB_USERNAME:siem_user}
spring.datasource.password=${DB_PASSWORD:siem_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false

# =============================================
# Security / JWT
# =============================================
jwt.secret=${JWT_SECRET:4f8b2c1d9e3a7f6b0c5d2e8a1b4c7f9e3d6a0b5c8e2f1a4d7b0c3e6f9a2d5b8}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# =============================================
# OpenAPI / Swagger
# =============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# =============================================
# Actuator
# =============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=SIEM Platform
info.app.version=1.0.0
info.app.description=Security Information and Event Management Platform

# =============================================
# Logging
# =============================================
logging.level.com.siem=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# CORS
# =============================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.max-age=3600
