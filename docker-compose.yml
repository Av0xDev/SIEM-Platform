version: "3.9"

networks:
  siem-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siem}
      POSTGRES_USER: ${POSTGRES_USER:-siem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-siempassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - siem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-siem} -d ${POSTGRES_DB:-siem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-siem}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-siempassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-siem_logs}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-siempassword}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-siempassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-siem}
      DB_USER: ${POSTGRES_USER:-siem}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-siempassword}
      MONGO_URI: ${MONGO_URI:-mongodb://siem:siempassword@mongodb:27017/siem_logs?authSource=admin}
      REDIS_URL: ${REDIS_URL:-redis://:siempassword@redis:6379/0}
      SECRET_KEY: ${SECRET_KEY:-changeme-secret-key}
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/siem}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-siem}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-siempassword}
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-php:
    build:
      context: ./backend-php
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://backend-python:5000}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-changeme-webhook-secret}
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-0}
    depends_on:
      backend-python:
        condition: service_healthy
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend-ruby:
    build:
      context: ./backend-ruby
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL:-http://backend-python:5000}
      JAVA_SERVICE_URL: ${JAVA_SERVICE_URL:-http://backend-java:8080}
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-60}
    depends_on:
      backend-python:
        condition: service_healthy
      backend-java:
        condition: service_healthy
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      backend-python:
        condition: service_healthy
      backend-java:
        condition: service_healthy
    networks:
      - siem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
